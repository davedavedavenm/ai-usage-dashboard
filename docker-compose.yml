services:
  ai-usage-dashboard:
    build: .
    image: ai-usage-dashboard:latest
    container_name: ai-usage-dashboard
    restart: unless-stopped
    ports:
      - "8099:8099"
    environment:
      - INGEST_KEY=${INGEST_KEY}
    volumes:
      - ./data:/app/data

  # Logged-in Chromium holding the Alibaba Bailian session (Qwen percentages).
  # The desktop UI is password-protected (CUSTOM_USER/PASSWORD from stack
  # .env) and published on the LAN + tailnet; CDP stays loopback-only behind
  # the cdp-relay sidecar below — never expose DevTools to a network.
  qwen-browser:
    image: lscr.io/linuxserver/chromium:latest
    container_name: qwen-browser
    restart: unless-stopped
    shm_size: "1gb"
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Europe/London
      - CUSTOM_USER=${QWEN_UI_USER:?set QWEN_UI_USER in stack .env}
      - PASSWORD=${QWEN_UI_PASSWORD:?set QWEN_UI_PASSWORD in stack .env}
      # Chrome ≥136 refuses CDP on a default profile dir, hence explicit
      # --user-data-dir. Chromium now hard-binds CDP to its own loopback
      # (--remote-debugging-address is ignored), so 9222 stays internal and
      # the cdp-relay sidecar below publishes it.
      - CHROME_CLI=--remote-debugging-port=9222 --user-data-dir=/config/chrome-profile
    # Publish the image's HTTPS listener (container :3001, self-signed cert in
    # ./data/qwen-browser/ssl) — Selkies' UI rejects plain-HTTP origins
    # ("requires a secure connection"), so https:// is the supported path.
    # CDP relay stays loopback-only.
    ports:
      - "192.168.1.143:3099:3001"
      - "100.65.57.85:3099:3001"
      - "127.0.0.1:9333:9333"
    volumes:
      - ./data/qwen-browser:/config

  # Chromium accepts CDP connections only from its own loopback; this sidecar
  # shares qwen-browser's network namespace and relays 0.0.0.0:9333 (published
  # loopback-only on the host) -> 127.0.0.1:9222 for the host-side collector.
  cdp-relay:
    image: alpine/socat:latest
    container_name: qwen-cdp-relay
    restart: unless-stopped
    network_mode: "service:qwen-browser"
    command: TCP-LISTEN:9333,fork,reuseaddr TCP4:127.0.0.1:9222
